# KeraScan school-screening protocol. This is the single source of truth for
# active UI labels, validation, referral rules, and report thresholds.
protocol_version: "kerascan-school-screening-provisional-1"
effective_date: "2026-08-21"
approval_status: "provisional-study-protocol"
initial_image_policy: "good-quality-only"
require_od_image: true
require_os_image: true
require_complete_measurements: true

k2_abnormal_above_d: 46.8
pachymetry_abnormal_below_um: 480
cylinder_magnitude_abnormal_above_d: 1.5
pachymetry_measurement_type: "device_reported"

detailed_pdf_for_actions:
  - "REFER"

# This software version is intentionally distinct from the image-pipeline and
# model versions, which are recorded from the exact image-analysis run.
software_version: "phase4-school-screening"

disclaimer: >
  KeraScan is an experimental initial screening aid. This report does not
  diagnose or exclude keratoconus. A screen-positive result indicates that
  further ophthalmic evaluation is recommended outside this application.
